<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI 应用与算法面试题完整学习问答记录。">
  <title>AI 应用与算法面试题整理｜完整学习问答记录</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <style>
    :root{--ink:#263448;--muted:#63758a;--line:#e0e7ef;--blue:#2a678f;--paper:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px max(18px,calc((100vw - 1160px)/2));box-shadow:0 2px 10px #19314e08}
    .topline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.title{font-weight:700;color:#213b55}.meta{color:var(--muted);font-size:13px}#search{margin-left:auto;width:min(360px,100%);border:1px solid #ccd8e4;border-radius:8px;padding:8px 11px;font:inherit}
    main{max-width:1160px;margin:22px auto;padding:0 18px 50px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 95px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px}.toc strong{display:block;margin:0 0 8px}.toc a{display:block;padding:5px 7px;color:#526b82;text-decoration:none;font-size:13px;line-height:1.45;border-radius:6px}.toc a:hover{background:#edf4f9;color:var(--blue)}article{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,36px);box-shadow:0 3px 16px #19314e08}
    h1{font-size:29px;line-height:1.35;margin:0 0 18px;color:#1c3852}h2{font-size:23px;line-height:1.4;margin:40px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line);color:#244f70}h3{font-size:19px;line-height:1.5;margin:28px 0 12px;color:#2c5b7e}h4{font-size:16px;margin:22px 0 8px}p,ul,ol,blockquote,table,pre{margin:12px 0}ul,ol{padding-left:25px}li{padding-left:2px;margin:4px 0}blockquote{padding:10px 15px;background:#f4f8fb;border-left:4px solid #85abc7;color:#4d6278}a{color:#236a9a}code{font: .9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f0f3f6;border-radius:4px;padding:2px 4px}pre{overflow:auto;padding:15px;border-radius:9px;background:#1d2b3a;color:#ecf2f8}pre code{background:transparent;color:inherit;padding:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:#f1f6fa;color:#315773}hr{border:0;border-top:1px solid var(--line);margin:28px 0}.loading,.error{max-width:850px;margin:40px auto;background:white;border:1px solid var(--line);border-radius:10px;padding:24px;color:var(--muted)}.error{color:#943f3f}
    @media(max-width:800px){main{display:block;margin:12px auto}.toc{display:none}article{padding:20px 16px}h1{font-size:24px}h2{font-size:21px}header{padding:10px 14px}#search{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <header><div class="topline"><span class="title">AI 应用与算法面试题整理</span><span class="meta" id="status">正在加载完整问答内容…</span><input id="search" type="search" aria-label="搜索题库" placeholder="搜索问题或关键词"></div></header>
  <main><aside class="toc" id="toc" aria-label="模块目录"><strong>模块目录</strong><div id="toc-links"></div></aside><article id="content"><p class="loading">正在读取完整学习问答记录…</p></article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    const article=document.getElementById('content'),status=document.getElementById('status'),search=document.getElementById('search');
    marked.setOptions({gfm:true,breaks:false,highlight:(code,lang)=>{try{return lang&&hljs.getLanguage(lang)?hljs.highlight(code,{language:lang}).value:hljs.highlightAuto(code).value}catch{return code}}});
    const source=new URLSearchParams(location.search).get('file')||'ai-app-algorithm-interview.md';
    fetch(`./${encodeURIComponent(source)}`).then(response=>{if(!response.ok)throw new Error(`题库读取失败（HTTP ${response.status}）`);return response.text()}).then(markdown=>{
      article.innerHTML=marked.parse(markdown);
      article.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-wrap';table.before(wrap);wrap.append(table)});
      article.querySelectorAll('pre code').forEach(block=>hljs.highlightElement(block));
      const headings=[...article.querySelectorAll('h2')];
      headings.forEach((heading,index)=>{const id=`module-${index+1}`;heading.id=id;const link=document.createElement('a');link.href=`#${id}`;link.textContent=heading.textContent;document.getElementById('toc-links').append(link)});
      status.textContent=`${headings.length} 个模块 · 完整学习问答记录`;
    }).catch(error=>{article.innerHTML=`<div class="error">${error.message}。请刷新页面重试。</div>`;status.textContent='加载失败'});
    search.addEventListener('input',()=>{const term=search.value.trim().toLocaleLowerCase();for(const node of article.querySelectorAll('h1,h2,h3,h4,p,li,blockquote,table,pre'))node.classList.toggle('search-hidden',Boolean(term)&&!node.textContent.toLocaleLowerCase().includes(term));});
  </script>
  <style>.search-hidden{display:none!important}</style>
</body>
</html>
